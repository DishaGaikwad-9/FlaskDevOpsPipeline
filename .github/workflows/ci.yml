
name: Flask API CI and Docker Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Run flake8
        run: python -m flake8 app.py test_app.py

  publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-api:1.0.1
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-api:latest

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [test, publish]
    if: ${{ always() }}

    steps:
      - name: Send workflow result to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_RESULT: ${{ needs.test.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret is missing or empty."
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            STATUS="FAILED"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            STATUS="TESTS PASSED - DOCKER PUBLISH SKIPPED"
          elif [ "$PUBLISH_RESULT" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          export STATUS

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          status = os.environ["STATUS"]
          webhook = os.environ["DISCORD_WEBHOOK"]

          message = {
              "username": "Flask DevOps Pipeline",
              "embeds": [{
                  "title": f"Pipeline {status}",
                  "description": (
                      f"Repository: {os.environ['REPOSITORY']}\n"
                      f"Branch: {os.environ['BRANCH']}\n"
                      f"Event: {os.environ['EVENT_NAME']}\n"
                      f"Tests: {os.environ['TEST_RESULT']}\n"
                      f"Docker publishing: {os.environ['PUBLISH_RESULT']}\n"
                      f"Commit: {os.environ['COMMIT'][:7]}\n"
                      f"[View workflow run]({os.environ['RUN_URL']})"
                  )
              }]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(message).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/DishaGaikwad-9/FlaskDevOpsPipeline, 1.0)",
                },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(
                      "Discord notification sent. HTTP status:",
                      response.status,
                  )
          except urllib.error.HTTPError as error:
              print("Discord HTTP status:", error.code)
              print(
                  "Discord error response:",
                  error.read().decode("utf-8", errors="replace"),
              )
              raise
          except urllib.error.URLError as error:
              print("Could not connect to Discord:", error.reason)
              raise
          PY
